[package]
name = "schoolbot"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]
bytes = "1.12.1"
# dhat = "0.3.3"
# dotenvy = "0.15.7"
# fstrings = "0.2.3"
# office_oxide = "0.1.12"
# parking_lot = "0.12.5"
# reqwest = "0.13.5"
rustix = { version = "1.1.5", default-features = false, features = ["time", "net"] }
thiserror = { version = "2.0.20", default-features = false }
