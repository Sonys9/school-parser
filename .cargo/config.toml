[build]
target = "x86_64-unknown-linux-gnu" 

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096",
    "-C", "link-arg=-z", "-C", "link-arg=common-page-size=4096",
    "-C", "link-arg=-Wl,--gc-sections",
]